[project]
name = "airport-intel"
version = "0.3.0"
description = "Airport Investment Intelligence — data foundation, analytics engine, grounded agent, analyst workspace"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "certifi",          # CA bundle for urllib (python.org macOS builds have none)
]

[project.optional-dependencies]
app = ["fastapi>=0.115", "uvicorn>=0.30"]   # MIT / BSD-3
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
airport-data = "airport_data.cli:main"
airport-app = "airport_app.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airport_data = ["derived.sql", "sources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test needs internet access (skipped unless AIRPORT_DATA_NETWORK_TESTS=1)",
    "seed: test builds the full database from the committed seed archive (slow)",
]
