[project]
name = "airport-intel"
version = "0.1.0"
description = "Airport Investment Intelligence — data foundation (ingestion, raw archive, validation, DuckDB build)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "certifi",          # CA bundle for urllib (python.org macOS builds have none)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
airport-data = "airport_data.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airport_data = ["derived.sql", "sources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test needs internet access (skipped unless AIRPORT_DATA_NETWORK_TESTS=1)",
    "seed: test builds the full database from the committed seed archive (slow)",
]
