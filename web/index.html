<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airport Investment Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/vega.min.js"></script>
  <script src="/static/vendor/vega-lite.min.js"></script>
  <script src="/static/vendor/vega-embed.min.js"></script>
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail">
    <div class="brand">
      <div class="mark">
        <!-- compass-rose / runway mark -->
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
          <circle cx="14" cy="14" r="12.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="14" cy="14" r="8" fill="none" stroke="var(--magenta)" stroke-width="1.2" stroke-dasharray="2 2"/>
          <path d="M14 3 L15.6 14 L14 25 L12.4 14 Z" fill="currentColor"/>
          <path d="M3 14 L14 12.8 L25 14 L14 15.2 Z" fill="var(--magenta)"/>
        </svg>
        <h1>Airport Investment<br>Intelligence</h1>
      </div>
      <p>US airport modernization · evidence-first analyst</p>
    </div>
    <button class="new-btn" id="newBtn">New analysis <span>＋</span></button>
    <h2>Analyses</h2>
    <ul class="convs" id="convs"></ul>
    <div class="rail-foot">
      <span class="badge" id="backendBadge"><span class="dot"></span><span>…</span></span>
      <span id="buildInfo" class="mono"></span>
      <button class="linkish" id="sourcesLink">Data sources &amp; licenses</button>
      <button class="linkish" id="themeBtn">Toggle chart-paper / night</button>
    </div>
  </aside>

  <main class="log">
    <header class="log-head">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Analyses">☰</button>
      <h2 class="title" id="convTitle">New analysis</h2>
      <button class="ctx-meter" id="ctxMeter" title="Context used for the last request — click for the memory inspector">
        <span class="bar"><b style="width:0"></b><i style="width:0"></i></span><span id="ctxText">context —</span>
      </button>
      <button class="icon-btn insp-btn" id="inspBtn">Inspector</button>
    </header>
    <section class="turns" id="turns" aria-live="polite"></section>
    <footer class="composer">
      <form id="form">
        <textarea id="input" rows="1" placeholder="Ask about airports, regions, congestion, growth, forecasts, investment screens…" aria-label="Question"></textarea>
        <button class="send" id="sendBtn" type="submit">Ask</button>
      </form>
      <div class="hint">
        <span>Every number links to its finding · Enter to send, Shift+Enter for a new line</span>
      </div>
    </footer>
  </main>

  <aside class="inspector" id="inspector">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="evidence" aria-selected="true">Evidence</button>
      <button role="tab" data-tab="memory" aria-selected="false">Memory</button>
      <button role="tab" data-tab="sources" aria-selected="false">Sources</button>
      <button class="x icon-btn" id="inspClose" aria-label="Close inspector">✕</button>
    </nav>
    <div class="pane" id="pane"></div>
  </aside>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
