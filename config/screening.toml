# Passenger Growth Opportunity Screen: stage A of the three-stage method (ARCHITECTURE.md, "Scoring methodology").
# Frozen, versioned model definition. It ranks forecast and realized passenger growth and market income.
# It does NOT establish terminal need (stage B) or project returns (stage C), and it is not a valuation.
model_version = "1.0"
disclaimer = "Passenger growth opportunity screen (stage A), not a terminal-need assessment or a financial valuation: terminal capacity, costs, debt, airline-agreement economics and construction risk are not modelled."

[gate]
min_enplanements = 500000           # latest CY (FAA ACAIS); smaller airports listed as 'below investment scale'

[[component]]
id = "incremental_enplanements"
label = "Projected passenger increase (FAA TAF FY2025→FY2035, absolute)"
metric = { id = "taf_enplanements", window = { fy = 2035 }, transform = { type = "abs_change", compare_window = { fy = 2025 } } }
scale = "log10"
lo = 10000          # ≤ 10k additional enplanements -> 0
hi = 10000000       # ≥ 10M -> 100
weight = 0.50

[[component]]
id = "realized_growth"
label = "Realized passenger growth (T-100, trailing 12 months vs prior 12)"
metric = { id = "passengers", transform = { type = "pct_change" } }
scale = "linear"
lo = -0.05
hi = 0.10
weight = 0.30

[[component]]
id = "market_income"
label = "Home-CBSA per-capita income (latest BEA year)"
metric = { id = "cbsa_per_capita_income" }
scale = "linear"
lo = 45000
hi = 110000
weight = 0.20

[scenarios]
base = [0.50, 0.30, 0.20]
equal_weights = [0.3334, 0.3333, 0.3333]
demand_only = [1.0, 0.0, 0.0]
momentum_heavy = [0.30, 0.50, 0.20]

[ties]
points = 3.0                        # score gaps below this are reported as ties

[flags]
carrier_concentration_share = 0.50  # largest operating carrier seat share
airfield_binding_hour_share = 0.05  # share of operating hours where the (lower-bound) schedule exceeds the IMC rate
