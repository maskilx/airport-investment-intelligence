# Default acquisition plan used by `python -m airport_data fetch --all-default`.
# Periods: "latest" | "available" | "START:END" | "p1,p2,..."
# Changing scope = editing this file; no code changes.

[sources.bts_t100_segment]
periods = "2024-01:2026-07"          # 31 months: two full CYs (YoY, FAA cross-check) + latest

[sources.bts_ontime]
periods = "2025-09:2026-08"           # 12 consecutive months (~30 MB each); 24 months needs Git LFS first

[sources.faa_atads_ops]
periods = "2023-10:2026-09"           # FY2024-FY2026 complete; towered-airport operations, ~0.3 MB/month

[sources.bts_lookups]
periods = "latest"

[sources.faa_enplanements]
periods = "latest"                    # CY2025 workbook also carries CY2024

[sources.faa_cargo]
periods = "latest"

[sources.faa_taf]
periods = "latest"

[sources.faa_grants]
periods = "2021:2025"                 # FY2021-25: the grant-detail layout the adapter validates (FY2026 adds new program columns)

[sources.faa_npias]
periods = "latest"

[sources.ourairports]
periods = "latest"

[sources.faa_nasr_apt]
periods = "latest"                    # current 28-day cycle

[sources.census_cbsa]
periods = "2023"

[sources.bea_cainc1]
periods = "latest-release"

[sources.ref_county_aliases]
periods = "current"

[sources.ref_airport_geo_overrides]
periods = "current"

[sources.ref_us_states]
periods = "current"

[sources.curated_constraints]
periods = "current"
